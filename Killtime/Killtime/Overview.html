<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Universal Dark/Light Mode Theme System -->
  <link rel="stylesheet" href="css/theme.css">
  <script src="scripts_and_data/theme.js"></script>
  <script src="scripts_and_data/reader-progress.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview Navigation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary, #f4f4f4);
      color: var(--text-primary, #333);
      width: 100%;
      min-height: 100vh;
      display: flex;
    }

    #overview-sidebar {
      width: 320px;
      min-width: 320px;
      background-color: var(--header-bg, #2c3e50);
      color: var(--header-text, white);
      padding: 20px 15px;
      height: 100vh;
      overflow-y: auto;
      position: fixed;
      top: 0;
      left: 0;
      box-sizing: border-box;
      border-right: 1px solid var(--border-color, #34495e);
      z-index: 100;
    }

    #overview-sidebar h2 {
      margin-top: 0;
      font-size: 1.3em;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color, #34495e);
    }

    #overview-sidebar ul {
      list-style-type: none;
      padding-left: 15px;
      margin: 5px 0;
    }

    #overview-sidebar li {
      margin: 6px 0;
    }

    #overview-sidebar a,
    #overview-sidebar p {
      color: var(--text-primary, white);
      text-decoration: none;
      font-size: 14px;
      display: block;
      margin: 0;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    #overview-sidebar a:hover,
    #overview-sidebar p:hover {
      background-color: var(--bg-tertiary, #34495e);
      color: var(--accent-primary, #58a6ff);
    }

    #overview-main-content {
      flex-grow: 1;
      margin-left: 330px;
      padding: 40px;
      min-height: 100vh;
      background-color: var(--bg-primary, #f4f4f4);
      color: var(--text-primary, #333);
      box-sizing: border-box;
    }

    .overview-folder {
      font-weight: bold;
      cursor: pointer;
      color: var(--accent-primary, #79c0ff);
      margin-top: 10px !important;
    }

    .overview-file {
      padding-left: 10px;
    }

    .overview-file p {
      color: var(--link-color, #58a6ff) !important;
    }

    .home-link {
      display: inline-block;
      margin-bottom: 15px;
      padding: 6px 12px;
      background-color: var(--bg-tertiary, #1f2937);
      color: var(--text-primary, #fff) !important;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid var(--border-color, #374151);
    }

    .home-link:hover {
      background-color: var(--accent-primary, #2563eb) !important;
      color: #fff !important;
    }

    /* === Narrow Layout (< 900px) === */
    .sidebar-toggle-btn {
      display: none;
      /* hidden on wide */
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background-color: var(--header-bg, #2c3e50);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 1.2em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      background-color: var(--accent-primary, #2563eb);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 90;
    }

    @media (max-width: 899px) {
      body {
        display: block;
      }

      .sidebar-toggle-btn {
        display: block;
      }

      #overview-sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 150;
      }

      #overview-sidebar.sidebar-open {
        transform: translateX(0);
      }

      .sidebar-overlay.sidebar-open {
        display: block;
      }

      #overview-main-content {
        margin-left: 0;
        padding: 20px;
        padding-top: 60px;
        /* room for hamburger btn */
      }
    }
  </style>
</head>

<body>
  <!-- Hamburger toggle (narrow screens only) -->
  <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleOverviewSidebar()">☰ Menu</button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleOverviewSidebar()"></div>

  <script>
    function toggleOverviewSidebar() {
      var sidebar = document.getElementById('overview-sidebar');
      var overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('sidebar-open');
      overlay.classList.toggle('sidebar-open');
    }
  </script>

  <div id="overview-sidebar">
    <a href="../../index.html" class="home-link">← Back to Universe Hub</a>

    </div>

    <h2>Overview Navigation</h2>
    <ul id="overview-file-tree">
    </ul>
  </div>

    function removeDuplicates(arr) {
      return [...new Set(arr)];
    }

    var menu;

    window.addEventListener('load', function () {
      menu = document.getElementById("overview-file-tree");

      const fileList = overviews.slice().sort();

      function createList(arr) {
        var location = null;
        arr.forEach((f) => {
          var locstr = "";
          if (location) {
            locstr = location.id;
          }
          var fEle = null;
          if (locstr != "") {
            fEle = document.getElementById(locstr + "-" + f.replaceAll(" ", "-"));
          } else {
            fEle = document.getElementById("overview-" + f.replaceAll(" ", "-"));
          }
          if (!fEle) {
            var newli = document.createElement("li");
            newli.classList.add("overview-folder");
            newli.innerHTML = f;
            if (locstr != "") {
              newli.id = locstr + "-" + f.replaceAll(" ", "-");
            } else {
              newli.id = "overview-" + f.replaceAll(" ", "-");
            }
            var newul = document.createElement("ul");
            newli.appendChild(newul);
            if (location) {
              location.children[0].appendChild(newli);
            } else {
              menu.appendChild(newli);
            }
            location = newli;
          } else {
            location = fEle;
          }
        });
      }

      var arboarr = [];
      fileList.forEach(goThroughOverviews);

      function goThroughOverviews(overview) {
        var arrtxt = overview.replace("./", "").substring(0, overview.replace("./", "").lastIndexOf("/")).replaceAll("%20", " ");
        if (arrtxt.length > 1) {
          arboarr.push(arrtxt);
        }
      }

      var dup = removeDuplicates(arboarr).sort();
      dup.forEach((folder) => {
        var testarr = folder.split("/");
        createList(testarr);
      });

      fileList.forEach((f) => {
        var filename = f.substring(f.lastIndexOf("/"));
        var folderPath = f.replace(filename, "");
        var id = folderPath.replace("./", "overview-").replaceAll("/", "-").replaceAll("%20", "-").replace(".", "overview-");
        var idEle = document.getElementById(id);

        var newli = document.createElement("li");
        newli.classList.add("overview-file");
        var newp = document.createElement("p");
        newp.onclick = function () {
          getOverview(f);
        };
        var displayName = filename.startsWith("/") ? filename.substring(1) : filename;
        if (displayName.endsWith(".html")) {
          displayName = displayName.substring(0, displayName.length - 5);
        }
        newp.innerHTML = decodeURIComponent(displayName).replaceAll("%20", " ");
        newp.style.cursor = "pointer";
        newli.appendChild(newp);

        if (idEle && idEle.children[0]) {
          idEle.children[0].appendChild(newli);
        } else {
          menu.appendChild(newli);
        }
      });
    });

    function getOverview(overviewPath) {
      const mainContent = document.getElementById("overview-main-content");
      mainContent.innerHTML = "<p>Loading " + overviewPath + "...</p>";

      fetch(overviewPath)
        .then(response => {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const container = doc.querySelector('.container') || doc.querySelector('.content') || doc.querySelector('.book-container') || doc.body;
          mainContent.innerHTML = container ? container.innerHTML : html;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .catch(err => {
          mainContent.innerHTML = "<p style='color: #f85149;'>Error loading overview: " + err.message + "</p>";
        });
    }
